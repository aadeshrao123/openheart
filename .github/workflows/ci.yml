name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    name: Style invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ASCII only and line length
        shell: sh
        run: |
          report() {
            header=$1
            pattern=$2
            # Any further arguments narrow the search to those paths.
            shift 2
            grep_status=0

            # Exemptions are all generated files, rewritten wholesale by their
            # tool on the next run, so editing them to satisfy a column limit
            # accomplishes nothing. public/ is written by
            # scripts/build-legal-pages.mjs from docs/legal/, which is itself
            # held to the limit. locales/*.json is exempt for a different
            # reason: a translation string cannot be wrapped without changing
            # its value.
            matches=$(LC_ALL=C git grep -nI "$pattern" \
              -- ':!supabase/config.toml' \
                 ':!locales/*.json' \
                 ':!package-lock.json' \
                 ':!nativewind-env.d.ts' \
                 ':!public/*' \
                 "$@") || grep_status=$?

            # git grep exits 1 for "nothing matched" and 2 or more for a real
            # failure, which must not be reported as a clean run.
            if [ "$grep_status" -gt 1 ]; then
              exit "$grep_status"
            fi

            if [ "$grep_status" -eq 1 ]; then
              return 0
            fi

            # printf, not echo: sh here is dash, whose echo expands backslash
            # escapes, and a matched line containing \c truncates the report.
            printf '%s\n%s\n' "$header" "$matches"

            return 1
          }

          status=0

          # In the C locale every byte above 0x7f falls outside both
          # [:print:] and [:space:], so this pattern means "not ASCII".
          if ! report 'Non-ASCII characters:' '[^[:print:][:space:]]'; then
            status=1
          fi

          if ! report 'Lines over 100 characters:' '.\{101,\}'; then
            status=1
          fi

          # RTL. localization.md bans the physical direction utilities, because
          # layout written in left/right terms cannot flip for Arabic or Hebrew
          # and that cannot be retrofitted without a full visual pass. The
          # logical equivalents are ps- pe- ms- me- text-start text-end.
          #
          # Scoped to the source that renders, so the docs describing the rule
          # and this check's own definition do not trip it. A physical direction
          # in an animation transform is legitimate and is written as a style
          # value rather than a class, so it is not matched either.
          rtl='[" '"'"']\(pl\|pr\|ml\|mr\)-[0-9]'
          rtl="$rtl\|text-\(left\|right\)"
          rtl="$rtl\|flex-row-reverse"
          rtl="$rtl\|rounded-\(l\|r\)-[a-z0-9]"
          rtl="$rtl\|[\" ']\(left\|right\)-[0-9]"

          if ! report 'Physical direction utilities:' "$rtl" 'app' 'components'; then
            status=1
          fi

          # locales/*.json is exempt from the ASCII check above, and has to be:
          # a translation cannot be written without the letters of its own
          # language. Its punctuation is a different question. An em dash, an en
          # dash, a curly quote or an ellipsis character is the same defect in a
          # translation as it is in source, and no language needs one to be
          # written correctly.
          #
          # The pattern is the literal UTF-8 bytes, built with printf, because
          # LC_ALL=C makes git grep byte-oriented and that is what lets one
          # pattern match characters the C locale has no notion of. All seven
          # are E2 80 xx. Letters and script-specific punctuation are untouched,
          # so Arabic, Chinese and French copy passes unchanged.
          typographic=$(printf '\342\200\223\|\342\200\224\|\342\200\230')
          typographic="$typographic$(printf '\|\342\200\231\|\342\200\234')"
          typographic="$typographic$(printf '\|\342\200\235\|\342\200\246')"

          locale_status=0

          locale_matches=$(LC_ALL=C git grep -nI "$typographic" \
            -- 'locales/*.json') || locale_status=$?

          if [ "$locale_status" -gt 1 ]; then
            exit "$locale_status"
          fi

          if [ "$locale_status" -eq 0 ]; then
            printf '%s\n%s\n' \
              'Dashes, curly quotes or ellipsis characters in locales:' \
              "$locale_matches"
            status=1
          fi

          exit "$status"

      # No npm ci: this reads global.css and does arithmetic, and depends on
      # nothing. Keeping it out of the install job means a contrast regression
      # is reported in seconds rather than after a full dependency install.
      - name: Colour contrast
        run: node scripts/check-contrast.mjs

  app:
    name: Types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # lts/*, not a pinned number: package.json records the range the toolchain
      # actually requires, and a second copy of it here would be one more thing
      # to forget on an Expo upgrade.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - run: npm ci

      # lib/database.types.ts is generated and gitignored, so the checkout does
      # not have it and every import of it would fail to resolve. Generating it
      # here also means a migration that changes a column breaks the typecheck
      # instead of surfacing at runtime.
      - uses: supabase/setup-cli@v3

      - name: Generate database types
        run: |
          supabase db start
          supabase gen types typescript --local > lib/database.types.ts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The functions run on Deno rather than Node, so nothing in the job above
      # ever looked at them. media.test.ts existed for four phases and had never
      # been executed once, and a type error in moderation.ts survived because
      # of it. `deno test` type checks as well as runs.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # node-modules-dir=none keeps this to Deno's own npm cache. On auto it
      # reads the root package.json instead and tries to install the whole
      # React Native tree, none of which the functions import.
      - name: Type check and test
        run: >-
          deno test --no-lock --node-modules-dir=none
          --allow-read --allow-env supabase/functions/

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version pin here on purpose: the action reads the root lockfile
      # when one exists and otherwise installs the latest release.
      - uses: supabase/setup-cli@v3

      # db start applies supabase/migrations once Postgres is up, so a separate
      # migrate step would only repeat that work. Seeding is off in config.toml.
      # Source: supabase/cli, apps/cli-go/internal/db/start/start.go
      - name: Start local database
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db --local

  deploy:
    name: Deploy the web build
    runs-on: ubuntu-latest

    # Every other job, so a red test never reaches the domain. Pushes only:
    # a pull request from a fork would otherwise deploy unreviewed code with
    # the production keys.
    needs: [style, app, functions, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # No .env.production in CI, so scripts/build-web.mjs reads these. It
      # refuses to emit a bundle carrying a local address, which is the mistake
      # that produced this script in the first place.
      - name: Build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_IMAGE_BASE_URL: ${{ secrets.EXPO_PUBLIC_IMAGE_BASE_URL }}
        run: node scripts/build-web.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name openheart --branch main
